name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-lock.txt
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check repository contents
        run: python scripts/check-repository.py
      - name: Create isolated Python environment
        run: python -m venv .venv
      - name: Install locked backend dependencies
        run: .\.venv\Scripts\python.exe -m pip install -r backend/requirements-lock.txt
      - name: Check backend dependency compatibility
        run: .\.venv\Scripts\python.exe -m pip check
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Offline tests, type check and build
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check.ps1 -NoLocalConfig -Python "$PWD\.venv\Scripts\python.exe"
      - name: Temporary server lifecycle and proxy checks
        run: .\.venv\Scripts\python.exe scripts/test_dev_lifecycle.py
      - name: Check tracked files were not regenerated
        run: git diff --exit-code
